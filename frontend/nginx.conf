server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/users {
    proxy_pass http://user-service:8081/users;
  }

  location /api/events {
    proxy_pass http://event-service:8082/events;
  }

  location /api/registrations {
    proxy_pass http://registration-service:8083/registrations;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
