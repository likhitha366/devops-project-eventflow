server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/users {
    proxy_pass http://${USER_SERVICE_HOSTPORT}/users;
  }

  location /api/events {
    proxy_pass http://${EVENT_SERVICE_HOSTPORT}/events;
  }

  location /api/registrations {
    proxy_pass http://${REGISTRATION_SERVICE_HOSTPORT}/registrations;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
