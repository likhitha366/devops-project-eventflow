services:
  frontend:
    build: ./frontend
    image: ${REGISTRY:-eventflow}/frontend:${IMAGE_TAG:-latest}
    ports: ["8080:80"]
    depends_on: [user-service, event-service, registration-service]
    environment:
      PORT: "80"
      USER_SERVICE_HOSTPORT: user-service:8081
      EVENT_SERVICE_HOSTPORT: event-service:8082
      REGISTRATION_SERVICE_HOSTPORT: registration-service:8083
  user-service:
    build: ./user-service
    image: ${REGISTRY:-eventflow}/user-service:${IMAGE_TAG:-latest}
    ports: ["8081:8081"]
    environment:
      PORT: "8081"
  event-service:
    build: ./event-service
    image: ${REGISTRY:-eventflow}/event-service:${IMAGE_TAG:-latest}
    ports: ["8082:8082"]
    environment:
      PORT: "8082"
  registration-service:
    build: ./registration-service
    image: ${REGISTRY:-eventflow}/registration-service:${IMAGE_TAG:-latest}
    ports: ["8083:8083"]
    environment:
      PORT: "8083"
