services:
  frontend:
    build: ./frontend
    image: ${REGISTRY:-eventflow}/frontend:${IMAGE_TAG:-latest}
    ports: ["8080:80"]
    depends_on: [user-service, event-service, registration-service]
  user-service:
    build: ./user-service
    image: ${REGISTRY:-eventflow}/user-service:${IMAGE_TAG:-latest}
    ports: ["8081:8081"]
  event-service:
    build: ./event-service
    image: ${REGISTRY:-eventflow}/event-service:${IMAGE_TAG:-latest}
    ports: ["8082:8082"]
  registration-service:
    build: ./registration-service
    image: ${REGISTRY:-eventflow}/registration-service:${IMAGE_TAG:-latest}
    ports: ["8083:8083"]
