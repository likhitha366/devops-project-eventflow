apiVersion: v1
kind: Namespace
metadata:
  name: eventflow
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: eventflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec: { containers: [ { name: user-service, image: eventflow/user-service:latest, ports: [ { containerPort: 8081 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: eventflow }
spec: { selector: { app: user-service }, ports: [ { port: 8081, targetPort: 8081 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: event-service, namespace: eventflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: event-service } }
  template:
    metadata: { labels: { app: event-service } }
    spec: { containers: [ { name: event-service, image: eventflow/event-service:latest, ports: [ { containerPort: 8082 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: event-service, namespace: eventflow }
spec: { selector: { app: event-service }, ports: [ { port: 8082, targetPort: 8082 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: registration-service, namespace: eventflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: registration-service } }
  template:
    metadata: { labels: { app: registration-service } }
    spec: { containers: [ { name: registration-service, image: eventflow/registration-service:latest, ports: [ { containerPort: 8083 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: registration-service, namespace: eventflow }
spec: { selector: { app: registration-service }, ports: [ { port: 8083, targetPort: 8083 } ] }
