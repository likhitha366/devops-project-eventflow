apiVersion: v1
kind: Namespace
metadata:
  name: eventflow
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: eventflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec: { containers: [ { name: frontend, image: __REGISTRY__/frontend:__IMAGE_TAG__, ports: [ { containerPort: 80 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: eventflow }
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [ { port: 80, targetPort: 80, nodePort: 30080 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: user-service, namespace: eventflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec: { containers: [ { name: user-service, image: __REGISTRY__/user-service:__IMAGE_TAG__, ports: [ { containerPort: 8081 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: user-service, namespace: eventflow }
spec: { selector: { app: user-service }, ports: [ { port: 8081, targetPort: 8081 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: event-service, namespace: eventflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: event-service } }
  template:
    metadata: { labels: { app: event-service } }
    spec: { containers: [ { name: event-service, image: __REGISTRY__/event-service:__IMAGE_TAG__, ports: [ { containerPort: 8082 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: event-service, namespace: eventflow }
spec: { selector: { app: event-service }, ports: [ { port: 8082, targetPort: 8082 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: registration-service, namespace: eventflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: registration-service } }
  template:
    metadata: { labels: { app: registration-service } }
    spec: { containers: [ { name: registration-service, image: __REGISTRY__/registration-service:__IMAGE_TAG__, ports: [ { containerPort: 8083 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: registration-service, namespace: eventflow }
spec: { selector: { app: registration-service }, ports: [ { port: 8083, targetPort: 8083 } ] }
